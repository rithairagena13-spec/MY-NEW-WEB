<form action="/submit" method="POST">
<div>
    <label for ="fullname">Full Name:</label>

    </label>
    <input type="text" name="fullname"  placeholder=" Enter yourFull Name..." required>
</div>
<br>
<br>
<div>

    <label for="email">Email:</label>
    <input type="email" name="email" placeholder="Enter your Email..." required>
</div>
<br>
<br>
<div>

    <label for ="phone number"> Phone Number:</label>
    <input type="tel" name="phone number" placeholder="Enter your Phone Number..." required>
</div>
<br>
<br>
<div>

    <label for ="subject category">Subject Category:</label>
    <select name="subject category" required>
        <option value="">Select a subject category</option>
<option value="customer-support">Customer Support</option>
<option value="sales-inquiry">Sales Inquiry</option>
<option value="general-question">General Question</option>

        </select>

</div>
<br>
<br>

<fieldset>
    <legend>Prefered Contact Method</legend>
    
        <input type="radio" name="contact-method" value="email" required>
        <label for="contact-method">Email</label>
</fieldset>
<br>
<br>

<div>
    <label for="message">Message:</label>
    <textarea name="message" rows="4" cols="50" placeholder="Write your message..." required></textarea>
</div>
<br>
<br>
<button type="submit">Send Message</button>
<button type="reset">Reset</button>



</form>
